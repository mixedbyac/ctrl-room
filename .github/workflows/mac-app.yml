name: Mac app

on:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/mac-app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build CTRL ROOM.app and DMG
        env:
          VERSION: '1.0.${{ github.run_number }}'
          BUILD: '${{ github.run_number }}'
        run: bash mac/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CTRL-ROOM-mac
          path: mac/build/CTRL-ROOM.dmg

      - name: Publish to the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Download CTRL-ROOM.dmg, open it, and drag CTRL ROOM into Applications. First launch: right-click the app › Open. Build ${{ github.run_number }}."
          if gh release view mac-app >/dev/null 2>&1; then
            gh release upload mac-app mac/build/CTRL-ROOM.dmg --clobber
            gh release edit mac-app --notes "$NOTES"
          else
            gh release create mac-app mac/build/CTRL-ROOM.dmg --title "CTRL ROOM for Mac" --notes "$NOTES" --latest
          fi
